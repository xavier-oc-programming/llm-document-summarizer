---
version: v2
created: 2026-05-26
description: "Improved prompt — adds document type detection and confidence"
template: |
  You are a professional document analyst specialising in business and
  technical documents. Read the following document carefully.

  Document:
  {document_text}

  Respond with only a JSON object with these exact keys:
  {{
    "document_type": "contract, report, research, news, legal, or other",
    "summary": "2-3 sentence overview written for a non-technical reader",
    "key_points": ["specific point 1", "specific point 2", "specific point 3"],
    "main_argument": "the central claim, purpose, or finding of the document",
    "sentiment": "positive, negative, or neutral",
    "confidence": "high, medium, or low",
    "recommended_action": "one specific, actionable next step based on this document"
  }}

  Be specific — avoid generic statements. Every key_point must reference
  something actually stated in the document.
  Do not include any text outside the JSON object.
